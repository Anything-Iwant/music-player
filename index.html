<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MP3 자동 플레이어</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141414, #333333);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-box {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.1);
      padding: 28px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .desc {
      color: #dddddd;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .status {
      color: #ffd966;
      font-weight: bold;
      margin: 12px 0;
      line-height: 1.5;
    }

    .now-playing {
      min-height: 24px;
      margin: 14px 0;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      word-break: break-all;
    }

    audio {
      width: 100%;
      margin-top: 12px;
    }

    .button-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      background: white;
      color: #222;
    }

    button:hover {
      background: #eeeeee;
    }

    .song-list {
      margin-top: 24px;
      text-align: left;
      max-height: 310px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .song-item {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      cursor: pointer;
      color: #e8e8e8;
      word-break: break-all;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .song-item.active {
      color: #ffd966;
      font-weight: bold;
      background: rgba(255, 217, 102, 0.12);
    }

    .error {
      color: #ff9b9b;
      margin-top: 14px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-line;
    }

    .small {
      margin-top: 12px;
      font-size: 13px;
      color: #cccccc;
      line-height: 1.5;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="player-box">
    <h1>🎵 MP3 자동 플레이어</h1>

    <p class="desc">
      MP3 파일을 자동으로 불러와 순서대로 재생합니다.
    </p>

    <p id="status" class="status">MP3 파일을 찾는 중입니다.</p>
    <p id="nowPlaying" class="now-playing">아직 재생 중인 노래가 없습니다.</p>

    <audio id="player" controls></audio>

    <div class="button-area">
      <button onclick="startPlay()">처음부터 재생</button>
      <button onclick="playPrev()">이전 곡</button>
      <button onclick="playNext()">다음 곡</button>
    </div>

    <div id="songList" class="song-list"></div>

    <div id="debugInfo" class="small"></div>
    <div id="errorBox" class="error"></div>
  </div>

  <script>
    /*
      기본 폴더 이름입니다.

      현재 구조가 아래와 같으면 그대로 두세요.

      index.html
      music/
        song-01.mp3
    */
    const FOLDER_PATH = "music";

    /*
      보통 GitHub 기본 브랜치는 main입니다.
      예전 저장소는 master일 수 있어서 둘 다 자동으로 확인합니다.
    */
    const BRANCH_CANDIDATES = ["main", "master"];

    /*
      자동 인식이 실패할 때만 아래에 직접 입력하세요.

      예시:
      const MANUAL_GITHUB_ID = "kim123";
      const MANUAL_REPO_NAME = "music-player";

      보통은 비워둬도 됩니다.
    */
    const MANUAL_GITHUB_ID = "";
    const MANUAL_REPO_NAME = "";

    let songs = [];
    let currentIndex = 0;

    const player = document.getElementById("player");
    const statusText = document.getElementById("status");
    const nowPlaying = document.getElementById("nowPlaying");
    const songList = document.getElementById("songList");
    const errorBox = document.getElementById("errorBox");
    const debugInfo = document.getElementById("debugInfo");

    function getRepoInfoFromGitHubPagesUrl() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname
        .split("/")
        .filter(Boolean);

      if (!host.endsWith(".github.io")) {
        return null;
      }

      const owner = host.replace(".github.io", "");

      let repo = "";
      let basePath = "/";

      if (pathParts.length > 0) {
        repo = pathParts[0];
        basePath = "/" + repo + "/";
      } else {
        repo = owner + ".github.io";
        basePath = "/";
      }

      return {
        owner,
        repo,
        basePath
      };
    }

    function getManualRepoInfo() {
      if (!MANUAL_GITHUB_ID || !MANUAL_REPO_NAME) {
        return null;
      }

      return {
        owner: MANUAL_GITHUB_ID,
        repo: MANUAL_REPO_NAME,
        basePath: "/"
      };
    }

    function makePageMusicUrl(basePath, fileName) {
      return basePath + FOLDER_PATH + "/" + encodeURIComponent(fileName);
    }

    async function loadSongsFromGitHubApi(repoInfo) {
      for (const branch of BRANCH_CANDIDATES) {
        const apiUrl =
          `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${FOLDER_PATH}?ref=${branch}`;

        try {
          const response = await fetch(apiUrl);

          if (!response.ok) {
            continue;
          }

          const files = await response.json();

          if (!Array.isArray(files)) {
            continue;
          }

          const foundSongs = files
            .filter(file => {
              return file.type === "file" &&
                file.name.toLowerCase().endsWith(".mp3");
            })
            .sort((a, b) => {
              return a.name.localeCompare(b.name, "ko", {
                numeric: true,
                sensitivity: "base"
              });
            })
            .map(file => {
              return {
                name: file.name,
                url: makePageMusicUrl(repoInfo.basePath, file.name)
              };
            });

          if (foundSongs.length > 0) {
            return {
              songs: foundSongs,
              branch
            };
          }

        } catch (error) {
          console.log("GitHub API 확인 실패:", error);
        }
      }

      return {
        songs: [],
        branch: null
      };
    }

    async function checkFileExists(url) {
      try {
        const response = await fetch(url, {
          method: "HEAD"
        });

        return response.ok;
      } catch (error) {
        return false;
      }
    }

    async function loadSongsByFallbackScan(basePath) {
      const foundSongs = [];

      /*
        GitHub API가 실패했을 때를 대비한 예비 검색입니다.
        song-01.mp3 ~ song-50.mp3까지 직접 확인합니다.
      */
      for (let i = 1; i <= 50; i++) {
        const number = String(i).padStart(2, "0");
        const fileName = `song-${number}.mp3`;
        const url = makePageMusicUrl(basePath, fileName);

        const exists = await checkFileExists(url);

        if (exists) {
          foundSongs.push({
            name: fileName,
            url
          });
        }
      }

      return foundSongs;
    }

    async function loadSongs() {
      errorBox.textContent = "";
      songList.innerHTML = "";

      let repoInfo =
        getRepoInfoFromGitHubPagesUrl() ||
        getManualRepoInfo();

      let detectedText = "";

      if (repoInfo) {
        detectedText =
          `감지된 저장소: ${repoInfo.owner}/${repoInfo.repo}\n` +
          `음악 폴더: ${FOLDER_PATH}`;
      } else {
        detectedText =
          "GitHub Pages 주소가 아니라서 저장소를 자동 감지하지 못했습니다.\n" +
          "GitHub Pages 주소에서 실행하거나, 코드 위쪽 MANUAL_GITHUB_ID / MANUAL_REPO_NAME을 입력하세요.";
      }

      debugInfo.textContent = detectedText;

      if (repoInfo) {
        statusText.textContent = "music 폴더에서 MP3 목록을 확인하는 중입니다.";

        const apiResult = await loadSongsFromGitHubApi(repoInfo);

        songs = apiResult.songs;

        if (songs.length > 0) {
          statusText.textContent =
            `총 ${songs.length}개의 MP3 파일을 불러왔습니다. ${apiResult.branch}`;

          renderSongList();
          return;
        }

        statusText.textContent =
          "GitHub API에서 MP3를 찾지 못했습니다. song-01.mp3 직접 확인 중입니다.";

        songs = await loadSongsByFallbackScan(repoInfo.basePath);

        if (songs.length > 0) {
          statusText.textContent =
            `예비 검색으로 총 ${songs.length}개의 MP3 파일을 찾았습니다.`;

          renderSongList();
          return;
        }
      } else {
        /*
          로컬에서 index.html을 바로 열었을 때도 최소한 상대경로를 확인합니다.
          단, file:// 로 열면 브라우저 보안 정책 때문에 확인이 실패할 수 있습니다.
        */
        songs = await loadSongsByFallbackScan("./");

        if (songs.length > 0) {
          statusText.textContent =
            `예비 검색으로 총 ${songs.length}개의 MP3 파일을 찾았습니다.`;

          renderSongList();
          return;
        }
      }

      statusText.textContent = "재생할 MP3 파일이 없습니다.";

      errorBox.textContent =
        "확인해야 할 부분:\n" +
        "1. GitHub Pages 주소에서 실행했는지 확인하세요.\n" +
        "2. 폴더 이름이 정확히 music 인지 확인하세요.\n" +
        "3. 파일 위치가 music/song-01.mp3 인지 확인하세요.\n" +
        "4. 파일 확장자가 .mp3 인지 확인하세요.\n" +
        "5. 저장소가 Public 공개 저장소인지 확인하세요.\n" +
        "6. 브랜치가 main 또는 master 인지 확인하세요.\n" +
        "7. 파일 이름 대소문자가 정확한지 확인하세요.";
    }

    function renderSongList() {
      songList.innerHTML = "";

      songs.forEach((song, index) => {
        const item = document.createElement("div");
        item.className = "song-item";
        item.textContent = `${index + 1}. ${song.name}`;

        if (index === currentIndex) {
          item.classList.add("active");
        }

        item.onclick = () => {
          playSong(index);
        };

        songList.appendChild(item);
      });
    }

    function playSong(index) {
      if (songs.length === 0) {
        alert("재생할 MP3 파일이 없습니다.");
        return;
      }

      currentIndex = index;

      player.src = songs[currentIndex].url;
      nowPlaying.textContent = "현재 재생: " + songs[currentIndex].name;

      renderSongList();

      player.play().catch(() => {
        nowPlaying.textContent =
          "브라우저 정책 때문에 아래 오디오 재생 버튼을 한 번 눌러야 할 수 있습니다.";
      });
    }

    function startPlay() {
      playSong(0);
    }

    function playNext() {
      if (songs.length === 0) {
        alert("재생할 MP3 파일이 없습니다.");
        return;
      }

      currentIndex++;

      if (currentIndex >= songs.length) {
        currentIndex = 0;
      }

      playSong(currentIndex);
    }

    function playPrev() {
      if (songs.length === 0) {
        alert("재생할 MP3 파일이 없습니다.");
        return;
      }

      currentIndex--;

      if (currentIndex < 0) {
        currentIndex = songs.length - 1;
      }

      playSong(currentIndex);
    }

    player.addEventListener("ended", () => {
      currentIndex++;

      if (currentIndex < songs.length) {
        playSong(currentIndex);
      } else {
        nowPlaying.textContent = "전체 재생이 끝났습니다.";
        currentIndex = 0;
        renderSongList();
      }
    });

    loadSongs();
  </script>
</body>
</html>
