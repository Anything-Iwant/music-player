<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MP3 음악 듣기</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #202020, #3a3a3a);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-box {
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: #dddddd;
      margin-bottom: 25px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .download-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 999px;
      background: white;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .download-link:hover {
      background: #eeeeee;
    }
  </style>
</head>

<body>
  <div class="player-box">
    <h1>🎵 노래 듣기</h1>
    <p>아래 재생 버튼을 누르면 음악이 나옵니다.</p>

    <audio controls>
      <source src="./music/my-song.mp3" type="audio/mpeg">
      사용 중인 브라우저가 오디오 재생을 지원하지 않습니다.
    </audio>

    <br />

    <a class="download-link" href="./music/my-song.mp3" download>
      MP3 다운로드
    </a>
  </div>
</body>
</html>
